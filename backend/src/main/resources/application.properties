spring.application.name=snowboard-lesson-booking-v2
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/snowboard_v2}
spring.datasource.username=${DB_USER:snowboard_v2}
spring.datasource.password=${DB_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.servlet.session.timeout=30m
spring.session.jdbc.initialize-schema=never
identity.verification-key=${VERIFICATION_KEY:}
identity.public-url=${APP_PUBLIC_URL:http://localhost:5173}
identity.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.forward-headers-strategy=none
identity.trusted-proxy-host=${IDENTITY_TRUSTED_PROXY_HOST:}
server.servlet.session.cookie.http-only=true

# Media is explicitly enabled in local configuration or by production settings.
media.worker.enabled=${MEDIA_WORKER_ENABLED:false}
media.ffprobe-path=${FFPROBE_PATH:}
media.ffprobe-timeout-seconds=${FFPROBE_TIMEOUT_SECONDS:90}
media.storage.mode=${MEDIA_STORAGE_MODE:disabled}
media.storage.region=${MEDIA_REGION:}
media.storage.endpoint=${MEDIA_ENDPOINT:}
media.storage.public-endpoint=${MEDIA_PUBLIC_ENDPOINT:}
media.storage.staging-bucket=${MEDIA_STAGING_BUCKET:}
media.storage.frozen-bucket=${MEDIA_FROZEN_BUCKET:}
media.storage.cdn-base-url=${MEDIA_CDN_BASE_URL:}
media.storage.key-pair-id=${MEDIA_KEY_PAIR_ID:}
media.storage.signing-key-path=${MEDIA_SIGNING_KEY_PATH:}

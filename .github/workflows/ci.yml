name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build pinned media probe
        run: scripts/install-media-probe.sh
      - name: Backend tests, including MySQL 8.4
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  docs-and-compose:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-config-only
      MYSQL_ROOT_PASSWORD: ci-config-only-root
      VERIFICATION_KEY: ci-config-only-invalid-key-never-use-in-production
    steps:
      - uses: actions/checkout@v7
      - name: Documentation checks
        run: python3 ai-docs/check_docs.py
      - name: Compose configuration
        run: docker compose --env-file /dev/null -f deploy/compose.yaml config --quiet
      - name: Delivery behavior and configuration checks
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'

name: snowboard-v2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${V2_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: snowboard_v2
      MYSQL_USER: snowboard_v2
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    volumes:
      - mysql_v2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging: *default-logging

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    logging: *default-logging

  s3mock:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${V2_MEDIA_PORT:-9090}:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - media_v2_data:/s3mockroot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging: *default-logging

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${V2_BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      MEDIA_ENDPOINT: http://s3mock:9090
      MEDIA_PUBLIC_ENDPOINT: http://localhost:${V2_MEDIA_PORT:-9090}
      FFPROBE_PATH: /usr/local/bin/ffprobe
      DB_URL: jdbc:mysql://db:3306/snowboard_v2
      DB_USER: snowboard_v2
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      VERIFICATION_KEY: ${VERIFICATION_KEY:?Set VERIFICATION_KEY in deploy/.env}
      APP_PUBLIC_URL: ${V2_PUBLIC_URL:-http://localhost:8088}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-geer@local.test}
      BOOKING_REMINDERS_ENABLED: "${BOOKING_REMINDERS_ENABLED:-true}"
      BOOKING_MAIL_WORKER_ENABLED: "${BOOKING_MAIL_WORKER_ENABLED:-true}"
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      IDENTITY_TRUSTED_PROXY_HOST: frontend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${V2_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

volumes:
  mysql_v2_data:
  media_v2_data:

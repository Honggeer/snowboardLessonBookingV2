name: snowboard-v2-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    command: ["--innodb-buffer-pool-size=134217728", "--max-connections=40"]
    environment:
      MYSQL_DATABASE: snowboard_v2
      MYSQL_USER: snowboard_v2
      MYSQL_PASSWORD_FILE: /run/secrets/app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets: [app_password, root_password]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/spring/
      DB_URL: jdbc:mysql://db:3306/snowboard_v2
      DB_USER: snowboard_v2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      IDENTITY_COOKIE_SECURE: "true"
      IDENTITY_TRUSTED_PROXY_HOST: frontend
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set HTTPS public URL}
      MAIL_HOST: ${MAIL_HOST:?Set real SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:?Set SMTP user}
      MAIL_FROM: ${MAIL_FROM:?Set verified sender}
      BOOKING_REMINDERS_ENABLED: "${BOOKING_REMINDERS_ENABLED:-true}"
      BOOKING_MAIL_WORKER_ENABLED: "${BOOKING_MAIL_WORKER_ENABLED:-true}"
      MEDIA_WORKER_ENABLED: "true"
      MEDIA_STORAGE_MODE: aws
      MEDIA_REGION: ca-central-1
      MEDIA_STAGING_BUCKET: ${MEDIA_STAGING_BUCKET:?Set staging bucket}
      MEDIA_FROZEN_BUCKET: ${MEDIA_FROZEN_BUCKET:?Set frozen bucket}
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:?Set HTTPS CDN URL}
      MEDIA_KEY_PAIR_ID: ${MEDIA_KEY_PAIR_ID:?Set CloudFront public key ID}
      MEDIA_SIGNING_KEY_PATH: /run/secrets/media/cloudfront.pem
      FFPROBE_PATH: /usr/local/bin/ffprobe
    volumes:
      - type: bind
        source: ${SECRETS_DIR:?Set secrets directory}/spring
        target: /run/secrets/spring
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRETS_DIR:?Set secrets directory}/media
        target: /run/secrets/media
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set immutable FRONTEND_IMAGE}
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ../frontend/nginx.production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_DIR:?Set TLS directory}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACME_DIR:?Set ACME webroot}
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

secrets:
  app_password:
    file: ${SECRETS_DIR:?Set secrets directory}/spring/spring.datasource.password
  root_password:
    file: ${SECRETS_DIR:?Set secrets directory}/mysql.root.password

volumes:
  mysql_data:

# Exclude query strings, referrers and headers that can carry identity secrets.
log_format geer_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log geer_safe;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log geer_safe;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Resolve Docker service names again after backend container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    location = /api/actuator/health {
        proxy_pass $backend/actuator/health;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
